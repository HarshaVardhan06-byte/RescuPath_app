name: paramedic_app
description: RescuPath luxury real-time paramedic application.
publish_to: "none"
version: 2.1.0+3

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  geolocator: ^13.0.2
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.1
