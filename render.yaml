services:
  - type: web
    name: rescupath-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/start.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rescupath-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGIN_REGEX
        value: "^https?://.*"
      - key: ALLOW_PUBLIC_OPERATIONS_REGISTRATION
        value: "true"
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

databases:
  - name: rescupath-db
    plan: free
    databaseName: rescupath
    user: rescupath_user
